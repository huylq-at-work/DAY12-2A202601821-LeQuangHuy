name: CI

# Chạy khi push lên main VÀ khi mở pull_request vào main.
# pull_request là phần giá trị nhất: lỗi bị bắt trước khi merge, không phải sau.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Chạy checkpoint trên một máy sạch ──────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    # Máy CI không có .env; truyền config qua biến môi trường (đúng tinh thần
    # 12-Factor ở CP1: cùng code, môi trường khác chỉ khác biến).
    env:
      AGENT_API_KEY: ci-dummy
      REDIS_URL: "fake://"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chạy test
        # Loại test_cp5 (gọi vào bản deploy sống) và test_bonus_cicd (kiểm tra
        # badge của chính workflow này — chạy ở đây là tự tham chiếu vòng tròn).
        # -m "not docker": bỏ các test build image thật cho nhanh.
        run: |
          pytest tests/ -v -m "not docker" \
            --ignore=tests/test_cp5.py \
            --ignore=tests/test_bonus_cicd.py

  # ── 2. Build thử Docker image ─────────────────────────────────────
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        # Bắt các lỗi kiểu "file chỉ có trên máy tôi" hay .dockerignore loại
        # nhầm thứ cần thiết — phát hiện lúc build rẻ hơn lúc deploy nhiều.
        run: docker build -t day12-agent:ci .

  # ── 3. Deploy — chỉ khi test và build đều xanh ────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # needs: đợi cả hai job trên PASS. Thiếu dòng này thì code hỏng vẫn lên
    # production trong khi test đang đỏ.
    needs: [test, build]
    # if: chỉ deploy từ nhánh chính khi push; mở pull_request không kéo theo deploy.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # Railway tự deploy từ GitHub mỗi khi main đổi (native integration).
      # Job này là cổng chất lượng + smoke test xác nhận bản vừa lên còn sống,
      # thay vì gọi lại CLI (dễ gãy, làm badge đỏ oan).
      - name: Chờ Railway build bản mới
        run: sleep 45

      - name: Smoke test — liveness & readiness
        # curl -f trả mã lỗi khi HTTP không phải 2xx → job đỏ → biết ngay.
        run: |
          curl -fsS "https://day12-2a202601821-lequanghuy-production.up.railway.app/health"
          echo
          curl -fsS "https://day12-2a202601821-lequanghuy-production.up.railway.app/ready"
          echo

      - name: Smoke test — endpoint có xác thực
        # Token deploy/khóa API lấy từ GitHub Secrets, không bao giờ nằm trong
        # file YAML (dán vào là nó ở trong lịch sử git vĩnh viễn).
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://day12-2a202601821-lequanghuy-production.up.railway.app/ask" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.DEPLOY_API_KEY }}" \
            -H "X-User-Id: ci-smoke-${{ github.run_id }}" \
            -d '{"question":"CI smoke test"}')
          echo "POST /ask -> $code"
          test "$code" = "200"
