# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set AGENT_API_KEY=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Bọc trong `sh -c` để $PORT được shell nội suy thành cổng Railway cấp
# (không có shell thì uvicorn nhận nguyên chuỗi "$PORT" và crash).
# `exec` để uvicorn thay thế sh, trở thành PID 1 và nhận trực tiếp SIGTERM —
# nếu không, sh nuốt tín hiệu và graceful shutdown không chạy khi deploy.
# ${PORT:-8000}: có PORT thì dùng, không có thì mặc định 8000.
startCommand = "sh -c 'exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --timeout-graceful-shutdown ${SHUTDOWN_GRACE_SECONDS:-25}'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
